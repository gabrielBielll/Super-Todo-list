<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro CRUD</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json,{
        &quot;name&quot;: &quot;Dashboard Financeiro&quot;,
        &quot;short_name&quot;: &quot;Finanças&quot;,
        &quot;start_url&quot;: &quot;.&quot;,
        &quot;display&quot;: &quot;standalone&quot;,
        &quot;background_color&quot;: &quot;#111827&quot;,
        &quot;theme_color&quot;: &quot;#111827&quot;,
        &quot;icons&quot;: [
            {
                &quot;src&quot;: &quot;https://placehold.co/192x192/111827/ffffff?text=Fin&quot;,
                &quot;type&quot;: &quot;image/png&quot;,
                &quot;sizes&quot;: &quot;192x192&quot;
            },
            {
                &quot;src&quot;: &quot;https://placehold.co/512x512/111827/ffffff?text=Fin&quot;,
                &quot;type&quot;: &quot;image/png&quot;,
                &quot;sizes&quot;: &quot;512x512&quot;
            }
        ]
    }">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .pulsate-red { box-shadow: 0 0 0 0 rgba(239, 68, 68, 1); animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .pulsate-yellow { box-shadow: 0 0 0 0 rgba(234, 179, 8, 1); animation: pulse-yellow 2s infinite; }
        @keyframes pulse-yellow {
            0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div id="root"></div>

    <script type="text/babel">
        const initialDb = {
            usuarios: {
                gabriel: { nome: "Gabriel", emoji: "👨🏻" },
                leticia: { nome: "Leticia", emoji: "👩🏻" }
            },
            contas: {
                leticia: { id: 'leticia', nome: 'Conta Leticia', saldo: 0 },
                gabriel: { id: 'gabriel', nome: 'Conta Gabriel', saldo: 0 }
            },
            acoes: [
                { id: 1, dia: 1, responsavel: "leticia", evento: "Recebimentos e Pagamentos", tarefas: [
                    { id: 101, descricao: "Receber Salário", origemDestino: "Crédito da Renda 1", tipo: "[+ RENDA]", valor: 1000, concluida: false, targetType: 'conta', targetId: 'leticia', operation: 'add' },
                    { id: 102, descricao: "Quitar Fatura da Obra", origemDestino: "Fatura do Cartão Nubank", tipo: "[🤖 AUTOMÁTICO]", valor: 1000, concluida: false, targetType: 'conta', targetId: 'leticia', operation: 'subtract' }
                ]},
                { id: 2, dia: 5, responsavel: "gabriel", evento: "Renda, Contas e Metas", tarefas: [
                    { id: 201, descricao: "Receber Salário", origemDestino: "Crédito da Renda 1", tipo: "[+ RENDA]", valor: 1500, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'add' },
                    { id: 202, descricao: "Pagar Conta Essencial", origemDestino: "Conta de Luz", tipo: "[🤖 AUTOMÁTICO]", valor: 120, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'subtract' },
                    { id: 203, descricao: "Carregar Cartão COMPRAS", origemDestino: "Cartão Pré-Pago Next", tipo: "[🧑‍💻 MANUAL]", valor: 650, concluida: false, targetType: 'cartao', targetId: 'compras', operation: 'add', sourceType: 'conta', sourceId: 'gabriel' },
                    { id: 204, descricao: "Abastecer Meta Reserva", origemDestino: "Caixinha Nubank: Reserva", tipo: "[🧑‍💻 MANUAL]", valor: 300, concluida: false, targetType: 'caixinha', targetId: 'reserva', operation: 'add', sourceType: 'conta', sourceId: 'gabriel' },
                    { id: 205, descricao: "Abastecer Meta Viagem", origemDestino: "Caixinha Nubank: Viagem", tipo: "[🧑‍💻 MANUAL]", valor: 200, concluida: false, targetType: 'caixinha', targetId: 'viagem', operation: 'add', sourceType: 'conta', sourceId: 'gabriel' },
                ]},
                { id: 3, dia: 7, responsavel: "gabriel", evento: "Pagamento do Aluguel", tarefas: [
                    { id: 301, descricao: "Pagar Aluguel", origemDestino: "Locador do Imóvel", tipo: "[🧑‍💻 MANUAL]", valor: 600, concluida: false, targetType: 'caixinha', targetId: 'aluguel', operation: 'subtract' },
                ]},
                { id: 4, dia: 15, responsavel: "leticia", evento: "Renda e Transferências", tarefas: [
                    { id: 401, descricao: "Receber Salário", origemDestino: "Crédito da Renda 2", tipo: "[+ RENDA]", valor: 1000, concluida: false, targetType: 'conta', targetId: 'leticia', operation: 'add' },
                    { id: 402, descricao: "Abastecer Meta Aluguel", origemDestino: "Caixinha Nubank: Aluguel", tipo: "[🧑‍💻 MANUAL]", valor: 600, concluida: false, targetType: 'caixinha', targetId: 'aluguel', operation: 'add', sourceType: 'conta', sourceId: 'leticia' },
                    { id: 403, descricao: "Enviar Fundo de Metas", origemDestino: "Conta do Gabriel", tipo: "[🧑‍💻 MANUAL]", valor: 400, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'add', sourceType: 'conta', sourceId: 'leticia' },
                ]},
                { id: 5, dia: 30, responsavel: "gabriel", evento: "Renda e Pagamentos Finais", tarefas: [
                    { id: 501, descricao: "Receber Salário", origemDestino: "Crédito da Renda 2", tipo: "[+ RENDA]", valor: 600, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'add' },
                    { id: 502, descricao: "Receber Fundo de Metas", origemDestino: "Transferência de Leticia", tipo: "[+ RENDA]", valor: 400, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'add' },
                    { id: 503, descricao: "Abastecer Meta Inglês", origemDestino: "Caixinha Nubank: Inglês", tipo: "[🧑‍💻 MANUAL]", valor: 300, concluida: false, targetType: 'caixinha', targetId: 'ingles', operation: 'add', sourceType: 'conta', sourceId: 'gabriel' },
                    { id: 504, descricao: "Recarregar Cartões", origemDestino: "Cartões Pré-Pagos", tipo: "[🧑‍💻 MANUAL]", valor: 600, concluida: false, targetType: 'multi', targets: [{type:'cartao', id:'delivery', value:150}, {type:'cartao', id:'mesada', value:300}, {type:'cartao', id:'lazer', value:150}], sourceType: 'conta', sourceId: 'gabriel' },
                    { id: 505, descricao: "Pagamentos Diversos", origemDestino: "Contas Diversas", tipo: "[🤖 AUTOMÁTICO]", valor: 100, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'subtract' },
                ]}
            ],
            caixinhas: {
                reserva: { id: 'reserva', nome: "Reserva de Emergência", saldo: 0, meta: 300 },
                viagem: { id: 'viagem', nome: "Viagem Anual", saldo: 0, meta: 200 },
                ingles: { id: 'ingles', nome: "Curso de Inglês", saldo: 0, meta: 300 },
                aluguel: { id: 'aluguel', nome: "Aluguel", saldo: 0, meta: 600 },
                arquiteto: { id: 'arquiteto', nome: "Arquiteto", saldo: 0, meta: 145 }
            },
            cartoes: {
                compras: { id: 'compras', nome: "Compras", saldo: 0, limite: 650 },
                delivery: { id: 'delivery', nome: "Delivery", saldo: 0, limite: 150 },
                mesada: { id: 'mesada', nome: "Mesada Pessoal", saldo: 0, limite: 300 },
                lazer: { id: 'lazer', nome: "Lazer", saldo: 0, limite: 150 }
            }
        };

        const App = () => {
            const { useState, useEffect, useMemo } = React;

            const [db, setDb] = useState(() => {
                const savedDb = localStorage.getItem('financeDb');
                try {
                    const parsedDb = savedDb ? JSON.parse(savedDb) : initialDb;
                    if (!parsedDb.contas) parsedDb.contas = initialDb.contas;
                    return parsedDb;
                } catch (e) {
                    console.error("Failed to parse localStorage data, resetting to initial data.", e);
                    return initialDb;
                }
            });

            const [today, setToday] = useState(new Date().getDate());
            const [checklistActionId, setChecklistActionId] = useState(null);
            const [editingActionId, setEditingActionId] = useState(null);
            const [view, setView] = useState('todos');
            const [isManagementModalOpen, setIsManagementModalOpen] = useState(false);

            useEffect(() => {
                localStorage.setItem('financeDb', JSON.stringify(db));
            }, [db]);

            useEffect(() => {
                const today = new Date().getDate();
                let needsUpdate = false;
                const newDb = JSON.parse(JSON.stringify(db));

                const executeTransaction = (task) => {
                    const multiplier = 1; // Always process as completion
                    if(task.sourceType && task.sourceId) {
                        const sourceItem = newDb[task.sourceType === 'conta' ? 'contas' : 'caixinhas'][task.sourceId];
                        if (sourceItem) sourceItem.saldo -= task.valor * multiplier;
                    }

                    if (task.targetType === 'multi') {
                        task.targets.forEach(target => {
                            const itemToUpdate = newDb[target.type === 'caixinha' ? 'caixinhas' : 'cartoes'][target.id];
                            if (itemToUpdate) itemToUpdate.saldo += target.value * multiplier;
                        });
                    } else if (task.targetType && task.targetId) {
                        const { targetType, targetId, valor, operation } = task;
                        const collectionName = targetType === 'conta' ? 'contas' : (targetType === 'caixinha' ? 'caixinhas' : 'cartoes');
                        const itemToUpdate = newDb[collectionName][targetId];
                        if (itemToUpdate) itemToUpdate.saldo += (operation === 'subtract' ? -valor : valor) * multiplier;
                    }
                };

                newDb.acoes.forEach(action => {
                    if (action.dia <= today) {
                        action.tarefas.forEach(task => {
                            if ((task.tipo === '[🤖 AUTOMÁTICO]' || task.tipo === '[+ RENDA]') && !task.concluida) {
                                needsUpdate = true;
                                executeTransaction(task);
                                task.concluida = true;
                            }
                        });
                    }
                });

                if (needsUpdate) {
                    setDb(newDb);
                }
            }, []);


            const filteredAcoes = useMemo(() => {
                return [...db.acoes].sort((a,b) => a.dia - b.dia).filter(acao => view === 'todos' || acao.responsavel === view);
            }, [db.acoes, view]);

            const getDayStatus = (day) => {
                const diff = day - today;
                if (diff < 0) return 'passado'; if (diff === 0) return 'hoje'; if (diff <= 2) return 'proximo'; return 'futuro';
            };

            // Handlers
            const handleSaveAction = (actionToSave) => {
                setDb(prevDb => {
                    const existingAction = prevDb.acoes.find(a => a.id === actionToSave.id);
                    if(existingAction) return {...prevDb, acoes: prevDb.acoes.map(a => a.id === actionToSave.id ? actionToSave : a)};
                    return {...prevDb, acoes: [...prevDb.acoes, actionToSave]};
                });
            };

            const handleToggleTask = (actionId, taskId) => {
                setDb(prevDb => {
                    const newDb = JSON.parse(JSON.stringify(prevDb));
                    let taskToUpdate;
                    newDb.acoes.forEach(a => a.tarefas.forEach(t => { if(t.id === taskId) taskToUpdate = t; }));
                    if (!taskToUpdate) return prevDb;

                    const isCompleting = !taskToUpdate.concluida;
                    const multiplier = isCompleting ? 1 : -1;

                    if(taskToUpdate.sourceType && taskToUpdate.sourceId) {
                        const sourceItem = newDb[taskToUpdate.sourceType === 'conta' ? 'contas' : 'caixinhas'][taskToUpdate.sourceId];
                        if (sourceItem) sourceItem.saldo -= taskToUpdate.valor * multiplier;
                    }

                    if (taskToUpdate.targetType === 'multi') {
                        taskToUpdate.targets.forEach(target => {
                            const itemToUpdate = newDb[target.type === 'caixinha' ? 'caixinhas' : 'cartoes'][target.id];
                            if (itemToUpdate) itemToUpdate.saldo += target.value * multiplier;
                        });
                    } else if (taskToUpdate.targetType && taskToUpdate.targetId) {
                        const { targetType, targetId, valor, operation } = taskToUpdate;
                        const collectionName = targetType === 'conta' ? 'contas' : (targetType === 'caixinha' ? 'caixinhas' : 'cartoes');
                        const itemToUpdate = newDb[collectionName][targetId];
                        if (itemToUpdate) itemToUpdate.saldo += (operation === 'subtract' ? -valor : valor) * multiplier;
                    }
                    taskToUpdate.concluida = isCompleting;
                    return newDb;
                });
            };

            const resetData = () => {
                if(window.confirm("Tem certeza que deseja resetar TODOS os dados para o padrão inicial?")){
                    localStorage.removeItem('financeDb'); setDb(initialDb);
                }
            };

            // Sub-componentes...
            const Header = () => (
                <header className="p-3 sm:p-4 bg-gray-800/50 backdrop-blur-sm sticky top-0 z-20 flex justify-between items-center border-b border-gray-700">
                    <div><h1 className="text-lg sm:text-xl font-bold text-cyan-400">Dashboard Financeiro</h1></div>
                    <div className="flex items-center gap-2">
                         <button onClick={() => setIsManagementModalOpen(true)} className="text-xs bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-md hover:bg-yellow-500/40 transition-colors">Gerenciar</button>
                        <button onClick={resetData} className="text-xs bg-red-500/20 text-red-400 px-3 py-1 rounded-md hover:bg-red-500/40 transition-colors">Resetar</button>
                    </div>
                </header>
            );

            const ContasPanel = () => (
                <div className="p-3 sm:p-4">
                     <h2 className="text-base sm:text-lg font-semibold mb-3">Contas Principais</h2>
                     <div className="grid grid-cols-2 gap-3 sm:gap-4">
                        {Object.values(db.contas).map(conta => (
                            <div key={conta.id} className="bg-gray-800 p-4 rounded-lg shadow-lg flex items-center gap-4">
                               <div className="text-3xl">{db.usuarios[conta.id].emoji}</div>
                               <div>
                                   <h3 className="font-semibold text-gray-300 text-sm sm:text-base">{conta.nome}</h3>
                                   <p className="text-xl sm:text-3xl font-bold text-white mt-1">R$ {Number(conta.saldo).toFixed(2)}</p>
                               </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const CaixinhasPanel = () => (
                <div className="p-3 sm:p-4">
                    <h2 className="text-base sm:text-lg font-semibold mb-3">Metas (Caixinhas)</h2>
                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 sm:gap-4">
                        {Object.values(db.caixinhas).map(caixinha => {
                            const progresso = caixinha.meta > 0 ? (caixinha.saldo / caixinha.meta) * 100 : 0;
                            return (<div key={caixinha.id} className="bg-gray-800 p-3 rounded-lg shadow-lg"> <h3 className="font-semibold text-gray-300 text-sm sm:text-base truncate">{caixinha.nome}</h3> <p className="text-lg sm:text-2xl font-bold text-cyan-400 mt-1">R$ {Number(caixinha.saldo).toFixed(2)}</p> <p className="text-xs sm:text-sm text-gray-400">Meta: R$ {Number(caixinha.meta).toFixed(2)}</p> <div className="w-full bg-gray-700 rounded-full h-2 sm:h-2.5 mt-3"><div className="bg-cyan-500 h-2 sm:h-2.5 rounded-full" style={{ width: `${progresso}%` }}></div></div> <p className="text-right text-xs mt-1 text-gray-500">{progresso.toFixed(0)}%</p> </div>);
                        })}
                    </div>
                </div>
            );

            const CartoesPanel = () => (
                <div className="p-3 sm:p-4">
                    <h2 className="text-base sm:text-lg font-semibold mb-3">Cartões Pré-Pagos</h2>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                        {Object.values(db.cartoes).map(cartao => {
                           const uso = cartao.limite > 0 ? (cartao.saldo / cartao.limite) * 100 : 0;
                            return (<div key={cartao.id} className="bg-gray-800 p-3 rounded-lg shadow-lg"> <h3 className="font-semibold text-gray-300 text-sm sm:text-base truncate">{cartao.nome}</h3> <p className="text-base sm:text-xl font-bold text-green-400 mt-1">R$ {Number(cartao.saldo).toFixed(2)}</p> <div className="w-full bg-gray-700 rounded-full h-1.5 mt-2"><div className="bg-green-500 h-1.5 rounded-full" style={{ width: `${uso}%` }}></div></div> <p className="text-xs text-gray-400 mt-1">de R$ {Number(cartao.limite).toFixed(2)}</p> </div>);
                        })}
                    </div>
                </div>
            );

            const ViewSwitcher = () => {
                const buttonClasses = (v) => `px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-200 ${view === v ? 'bg-cyan-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`;
                return (<div className="p-3 sm:p-4 border-b border-t border-gray-700/50"><div className="flex justify-center bg-gray-800 p-1 rounded-lg space-x-1 sm:space-x-2 max-w-sm mx-auto"> <button onClick={() => setView('todos')} className={buttonClasses('todos')}>Todos</button> <button onClick={() => setView('leticia')} className={buttonClasses('leticia')}>👩🏻 Leticia</button> <button onClick={() => setView('gabriel')} className={buttonClasses('gabriel')}>👨🏻 Gabriel</button> </div></div>);
            };

            const Timeline = () => (
                 <div className="p-3 sm:p-4">
                    <h2 className="text-base sm:text-lg font-semibold mb-4">Linha do Tempo Mensal</h2>
                    <div className="relative"><div className="absolute top-0 left-6 sm:left-8 bottom-0 w-0.5 bg-gray-700"></div><div className="space-y-8">
                            {filteredAcoes.map(acao => {
                                const status = getDayStatus(acao.dia); const pendentes = acao.tarefas.filter(t => !t.concluida).length; const statusClasses = { passado: "opacity-60", hoje: "border-red-500 pulsate-red", proximo: "border-yellow-500 pulsate-yellow", futuro: "border-gray-700" }; const avatarBg = status === 'hoje' ? 'bg-red-500' : status === 'proximo' ? 'bg-yellow-500' : 'bg-gray-600';
                                return (<div key={acao.id} className="grid grid-cols-[auto,1fr] gap-x-3 sm:gap-x-4 items-start relative"> <div className="flex flex-col items-center pt-1"><div className={`relative z-10 w-12 h-12 sm:w-16 sm:h-16 rounded-full flex items-center justify-center text-xl sm:text-2xl ${avatarBg}`}> <span className="absolute -top-2 -left-2 text-xs bg-gray-900 px-2 py-0.5 rounded-full font-bold">Dia {acao.dia}</span> {db.usuarios[acao.responsavel].emoji} </div></div> <div onClick={() => setChecklistActionId(acao.id)} className={`bg-gray-800 p-3 sm:p-4 rounded-lg border-2 cursor-pointer transition-all hover:border-cyan-500 ${statusClasses[status]}`}> <div className="flex justify-between items-start"><div><p className="font-bold text-base sm:text-lg">{acao.evento}</p><p className="text-xs sm:text-sm text-gray-400">Responsável: {db.usuarios[acao.responsavel].nome}</p></div> {pendentes > 0 && (<div className="flex items-center space-x-2 bg-red-500/20 text-red-400 px-2 sm:px-3 py-1 rounded-full text-xs sm:text-sm font-semibold"><span>{pendentes}</span><span className="hidden sm:inline">Pendente{pendentes > 1 ? 's' : ''}</span></div>)}</div><div className="mt-3 border-t border-gray-700 pt-3"><p className="text-xs text-gray-500">Clique para ver e concluir tarefas</p></div> </div></div>);
                            })}
                    </div></div>
                </div>
            );

            const ChecklistModal = () => {
                const action = db.acoes.find(a => a.id === checklistActionId); if (!action) return null;
                const typeColors = {'[+ RENDA]': 'bg-green-500/20 text-green-400','[🤖 AUTOMÁTICO]': 'bg-blue-500/20 text-blue-400','[🧑‍💻 MANUAL]': 'bg-yellow-500/20 text-yellow-400'};
                return (<div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setChecklistActionId(null)}> <div className="bg-gray-800 w-full max-w-md rounded-2xl shadow-2xl border border-gray-700 p-6 flex flex-col" onClick={e => e.stopPropagation()}> <div className="flex justify-between items-center mb-4"><div><h2 className="text-xl font-bold">Dia {action.dia}: {action.evento}</h2><p className="text-gray-400">Responsável: {db.usuarios[action.responsavel].emoji} {db.usuarios[action.responsavel].nome}</p></div><button onClick={() => setChecklistActionId(null)} className="text-gray-500 hover:text-white text-3xl">&times;</button></div> <div className="space-y-3 flex-grow overflow-y-auto pr-2"> {action.tarefas.map(tarefa => (<div key={tarefa.id} onClick={() => handleToggleTask(action.id, tarefa.id)} className={`flex items-center justify-between p-3 rounded-lg cursor-pointer transition-all ${tarefa.concluida ? 'bg-green-500/10 text-gray-400' : 'bg-gray-700/50 hover:bg-gray-700'}`}> <div className="flex-grow"> <div className="flex justify-between items-center mb-1"><p className={`font-medium ${tarefa.concluida ? 'line-through' : ''}`}>{tarefa.descricao}</p><span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${typeColors[tarefa.tipo] || 'bg-gray-500/20 text-gray-400'}`}>{tarefa.tipo}</span></div> <p className="text-sm text-gray-400">{tarefa.origemDestino}</p><p className="text-base font-bold text-cyan-400 mt-1">R$ {Number(tarefa.valor).toFixed(2)}</p> </div> <div className={`w-6 h-6 rounded-full flex items-center justify-center border-2 ml-4 flex-shrink-0 ${tarefa.concluida ? 'bg-green-500 border-green-500' : 'border-gray-500'}`}>{tarefa.concluida && <span>&#10003;</span>}</div> </div>))} </div> <button onClick={() => setChecklistActionId(null)} className="mt-6 w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-lg transition-colors flex-shrink-0">Fechar</button> </div> </div>);
            };

            const EditActionModal = () => {
                const action = db.acoes.find(a => a.id === editingActionId);
                const [editedAction, setEditedAction] = useState(null);
                useEffect(() => { if (action) setEditedAction(JSON.parse(JSON.stringify(action))); }, [action]); if (!editedAction) return null;

                const handleFieldChange = (e) => { const { name, value } = e.target; setEditedAction(p => ({...p, [name]: name === 'dia' ? parseInt(value) || 0 : value})); };
                const handleTaskChange = (taskId, field, value) => { setEditedAction(p => ({...p, tarefas: p.tarefas.map(t => t.id === taskId ? {...t, [field]: field === 'valor' ? parseFloat(value) || 0 : value} : t)})); };
                const handleAddTask = () => { setEditedAction(p => ({...p, tarefas: [...p.tarefas, { id: Date.now(), descricao: 'Nova Tarefa', origemDestino: 'Definir', valor: 0, tipo: '[🧑‍💻 MANUAL]', concluida: false}]})); };
                const handleDeleteTask = (taskId) => { setEditedAction(p => ({...p, tarefas: p.tarefas.filter(t => t.id !== taskId)})); };
                const handleSave = () => { handleSaveAction(editedAction); setEditingActionId(null); };
                const handleDeleteAction = (actionId) => { if(window.confirm("Apagar este evento?")){ setDb(p => ({...p, acoes: p.acoes.filter(a => a.id !== actionId)})); setEditingActionId(null); } };

                return (<div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-0 sm:p-4" onClick={() => setEditingActionId(null)}> <div className="bg-gray-800 w-full h-full sm:h-auto sm:w-full sm:max-w-lg rounded-none sm:rounded-2xl shadow-2xl border border-gray-700 p-6 flex flex-col" onClick={e => e.stopPropagation()}> <div className="flex justify-between items-center"><h2 className="text-xl font-bold mb-4">Editando Evento</h2><button onClick={() => setEditingActionId(null)} className="text-gray-500 hover:text-white text-3xl">&times;</button></div> <div className="flex-grow overflow-y-auto pr-2"> <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4"> <input name="dia" type="number" value={editedAction.dia} onChange={handleFieldChange} className="bg-gray-700 p-2 rounded col-span-1" placeholder="Dia"/> <input name="evento" type="text" value={editedAction.evento} onChange={handleFieldChange} className="bg-gray-700 p-2 rounded col-span-2" placeholder="Nome"/> <select name="responsavel" value={editedAction.responsavel} onChange={handleFieldChange} className="bg-gray-700 p-2 rounded col-span-3"><option value="gabriel">👨🏻 Gabriel</option><option value="leticia">👩🏻 Leticia</option></select> </div> <h3 className="text-lg font-semibold mb-2">Tarefas</h3> <div className="space-y-2"> {editedAction.tarefas.map(task => (<div key={task.id} className="bg-gray-700/50 p-2 rounded space-y-2"> <div className="flex items-center gap-2"><input type="text" value={task.descricao} onChange={e => handleTaskChange(task.id, 'descricao', e.target.value)} className="bg-gray-600 p-1 rounded w-full" placeholder="Descrição"/> <button onClick={() => handleDeleteTask(task.id)} className="text-red-400 p-1 rounded hover:bg-red-500/20 text-xl">🗑️</button></div> <div className="flex items-center gap-2"><input type="text" value={task.origemDestino} onChange={e => handleTaskChange(task.id, 'origemDestino', e.target.value)} className="bg-gray-600 p-1 rounded w-full" placeholder="Origem/Destino"/> <input type="number" step="0.01" value={task.valor} onChange={e => handleTaskChange(task.id, 'valor', e.target.value)} className="bg-gray-600 p-1 rounded w-28" placeholder="Valor"/></div><select value={task.tipo} onChange={e => handleTaskChange(task.id, 'tipo', e.target.value)} className="bg-gray-600 p-1 rounded w-full text-sm"> <option value="[🧑‍💻 MANUAL]">🧑‍💻 MANUAL</option> <option value="[🤖 AUTOMÁTICO]">🤖 AUTOMÁTICO</option> <option value="[+ RENDA]">+ RENDA</option> </select> </div>))} </div> <button onClick={handleAddTask} className="mt-4 w-full text-sm bg-blue-500/20 text-blue-300 py-2 rounded-lg hover:bg-blue-500/40">Adicionar Tarefa</button> </div> <div className="flex justify-between items-center mt-6 pt-4 border-t border-gray-700 flex-shrink-0"> <button onClick={() => handleDeleteAction(action.id)} className="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">Apagar</button> <div><button onClick={() => setEditingActionId(null)} className="text-gray-400 font-bold py-2 px-4 rounded-lg mr-2">Cancelar</button> <button onClick={handleSave} className="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-lg">Salvar</button></div> </div> </div> </div>);
            };

             const ManagementModal = () => {
                const [localDb, setLocalDb] = useState(() => JSON.parse(JSON.stringify(db)));
                const handleItemChange = (itemType, itemId, field, value) => { setLocalDb(p => { const newItems = {...p[itemType]}; const target = newItems[itemId]; if (field === 'meta' || field === 'limite') { if (itemType === 'caixinhas') target.meta = value; else target.limite = value; } else { target[field] = value; } return {...p, [itemType]: newItems }; }); };
                const handleAddItem = (itemType) => { const newId = `new_${Date.now()}`; const newItem = itemType === 'caixinhas' ? {id: newId, nome: 'Nova Caixinha', saldo: 0, meta: 100} : {id: newId, nome: 'Novo Cartão', saldo: 0, limite: 100}; setLocalDb(p => ({...p, [itemType]: {...p[itemType], [newId]: newItem }})); };
                const handleLocalDeleteItem = (itemType, itemId) => { if (window.confirm("Apagar este item?")) { setLocalDb(p => { const newItems = {...p[itemType]}; delete newItems[itemId]; return {...p, [itemType]: newItems }; }); } };
                const handleSaveAll = () => { setDb(localDb); setIsManagementModalOpen(false); };

                const renderItemEditor = (item, itemType) => (<div key={item.id} className="bg-gray-700/50 p-3 rounded-lg space-y-2"> <div><label className="text-xs text-gray-400 font-medium">Nome</label><input value={item.nome} onChange={e => handleItemChange(itemType, item.id, 'nome', e.target.value)} className="bg-gray-600 p-2 rounded w-full mt-1 text-sm"/></div> <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-gray-400 font-medium">Saldo</label><input type="number" step="0.01" value={item.saldo} onChange={e => handleItemChange(itemType, item.id, 'saldo', parseFloat(e.target.value) || 0)} className="bg-gray-600 p-2 rounded w-full mt-1 text-sm"/></div> <div><label className="text-xs text-gray-400 font-medium">{itemType === 'caixinhas' ? 'Meta' : 'Limite'}</label><input type="number" step="0.01" value={itemType === 'caixinhas' ? item.meta : item.limite} onChange={e => handleItemChange(itemType, item.id, itemType === 'caixinhas' ? 'meta' : 'limite', parseFloat(e.target.value) || 0)} className="bg-gray-600 p-2 rounded w-full mt-1 text-sm"/></div></div> <button onClick={() => handleLocalDeleteItem(itemType, item.id)} className="w-full text-sm bg-red-500/10 text-red-400 py-2 rounded-lg hover:bg-red-500/20">Apagar</button> </div>);

                 return (<div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-0 sm:p-4" onClick={() => setIsManagementModalOpen(false)}> <div className="bg-gray-800 w-full h-full sm:h-[90vh] sm:max-w-4xl rounded-none sm:rounded-2xl shadow-2xl border border-gray-700 p-4 sm:p-6 flex flex-col" onClick={e => e.stopPropagation()}> <div className="flex justify-between items-center mb-4 flex-shrink-0"><h2 className="text-xl font-bold">Gerenciar Finanças</h2><button onClick={() => setIsManagementModalOpen(false)} className="text-gray-500 hover:text-white text-3xl">&times;</button></div> <div className="flex-grow overflow-y-auto pr-2 grid grid-cols-1 lg:grid-cols-3 gap-x-6 gap-y-4"> <div className="lg:col-span-1"> <h3 className="text-lg font-semibold mb-3 text-cyan-400">Caixinhas</h3> <div className="space-y-3">{Object.values(localDb.caixinhas).map(item => renderItemEditor(item, 'caixinhas'))}</div> <button onClick={() => handleAddItem('caixinhas')} className="mt-4 w-full text-sm bg-blue-500/20 text-blue-300 py-2 rounded-lg hover:bg-blue-500/40">Adicionar Caixinha</button> </div> <div className="lg:col-span-1"> <h3 className="text-lg font-semibold mb-3 text-green-400">Cartões</h3> <div className="space-y-3">{Object.values(localDb.cartoes).map(item => renderItemEditor(item, 'cartoes'))}</div> <button onClick={() => handleAddItem('cartoes')} className="mt-4 w-full text-sm bg-blue-500/20 text-blue-300 py-2 rounded-lg hover:bg-blue-500/40">Adicionar Cartão</button> </div> <div className="lg:col-span-1"> <h3 className="text-lg font-semibold mb-3 text-yellow-400">Eventos</h3> <div className="space-y-2">{[...localDb.acoes].sort((a,b)=> a.dia-b.dia).map(action => (<div key={action.id} className="bg-gray-700/50 p-2 rounded-lg flex justify-between items-center"><div className="text-sm"><span className="font-bold">Dia {action.dia}:</span> {action.evento}</div> <button onClick={() => { setIsManagementModalOpen(false); setEditingActionId(action.id); }} className="text-xs bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-md hover:bg-yellow-500/40">Editar</button></div>))}</div> </div> </div> <div className="mt-6 flex justify-end flex-shrink-0 pt-4 border-t border-gray-700"><button onClick={() => setIsManagementModalOpen(false)} className="text-gray-400 font-bold py-2 px-4 rounded-lg mr-2">Cancelar</button> <button onClick={handleSaveAll} className="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-lg">Salvar Tudo</button></div> </div> </div>);
            };

            return (
                 <div className="min-h-screen pb-20">
                    <Header />
                     <main>
                        <ContasPanel />
                        <div className="px-3 sm:px-4"><div className="border-t border-gray-700/50"></div></div>
                        <CaixinhasPanel />
                        <div className="px-3 sm:px-4"><div className="border-t border-gray-700/50"></div></div>
                        <CartoesPanel />
                        <ViewSwitcher />
                        <Timeline />
                    </main>
                    {checklistActionId && <ChecklistModal />}
                    {editingActionId && <EditActionModal />}
                    {isManagementModalOpen && <ManagementModal />}
                    <button onClick={() => { const newAction = { id: Date.now(), dia: new Date().getDate(), responsavel: 'gabriel', evento: 'Novo Evento', tarefas: []}; handleSaveAction(newAction); setEditingActionId(newAction.id); }} className="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 bg-cyan-600 text-white w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-2xl sm:text-3xl shadow-lg hover:bg-cyan-700 transition-transform hover:scale-110 z-30">+</button>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

    </script>
</body>
</html>
